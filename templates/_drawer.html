{# Customer quick-view drawer + toast. Shared by the pages that can open a customer (command center, Risk × value). Behaviour: static/js/command.js #}
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="customerDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerCustId" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <div class="card-eyebrow">Customer</div>
      <div id="drawerCustId" style="font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px;">—</div>
      <div id="drawerPriorityBadge" style="margin-top:8px;"></div>
    </div>
    <button type="button" class="drawer-close" id="drawerCloseBtn" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer">
    <button type="button" class="btn-reached" id="drawerReachedBtn" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg>
      Mark as reached
    </button>
    <a href="#" id="drawerProfileLink" class="btn-view-profile">View full customer profile</a>
  </div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
